<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="t">
  <title id="t">You ask with website, goal and budget. The agent fills gaps into one brief. AdeptAds builds the campaign in 10 to 20 minutes, paused. You say start and ads go live.</title>
  <rect width="1200" height="180" rx="20" fill="#f8fafc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="48" y="40" width="240" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="168" y="84" font-size="20" font-weight="700" fill="#0f172a">You ask</text>
    <text x="168" y="112" font-size="16" fill="#475569">website, goal, budget</text>
    <path d="M298 90h26m-8 -7l8 7l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="336" y="40" width="240" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="456" y="84" font-size="20" font-weight="700" fill="#0f172a">Agent fills gaps</text>
    <text x="456" y="112" font-size="16" fill="#475569">one brief to agree</text>
    <path d="M586 90h26m-8 -7l8 7l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="624" y="40" width="240" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="744" y="84" font-size="20" font-weight="700" fill="#0f172a">AdeptAds builds</text>
    <text x="744" y="112" font-size="16" fill="#475569">10 to 20 min, paused</text>
    <path d="M874 90h26m-8 -7l8 7l-8 7" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="912" y="40" width="240" height="100" rx="50" fill="#ed311f"/>
    <text x="1032" y="84" font-size="20" font-weight="700" fill="#ffffff">You say start</text>
    <text x="1032" y="112" font-size="16" fill="#fde6e6">ads go live</text>
  </g>
</svg>
